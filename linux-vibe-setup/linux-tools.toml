# zipget recipe for native Ubuntu development tools
# Install with: zipget recipe linux-tools.toml
#
# Asset names are templated on the host CPU. setup_user.py overrides the
# defaults on arm64 hosts with:
#   zipget recipe --set arch=aarch64 --set goarch=arm64 linux-tools.toml

[vars]
bin_dir = "~/.local/bin"
# Rust/LLVM-style target architecture, used by most projects below.
arch = "x86_64"
# Go-style architecture name, used by fzf.
goarch = "amd64"

[herdr]
# Agent multiplexer - https://herdr.dev
github = { repo = "herdrdev/herdr", asset = "herdr-linux-${arch}" }
save_as = "${bin_dir}/herdr"
executable = true

[cship]
# Claude Code statusline - https://cship.dev
github = { repo = "stephenleo/cship", asset = "cship-${arch}-unknown-linux-musl" }
save_as = "${bin_dir}/cship"
executable = true

[microsoft-edit]
# Terminal-based text editor - https://github.com/microsoft/edit
# Note: only gnu builds available (no musl)
github = { repo = "microsoft/edit", asset = "${arch}-linux-gnu.tar.gz" }
unzip_to = "${bin_dir}"
files = "edit"

[starship]
# Cross-shell prompt - https://github.com/starship/starship
github = { repo = "starship/starship", asset = "${arch}-unknown-linux-musl.tar.gz" }
unzip_to = "${bin_dir}"
files = "starship"

[ripgrep]
# Fast regex search tool - https://github.com/BurntSushi/ripgrep
github = { repo = "BurntSushi/ripgrep", asset = "${arch}-unknown-linux-musl.tar.gz" }
unzip_to = "${bin_dir}"
files = "*/rg"

[fd]
# Fast find alternative - https://github.com/sharkdp/fd
github = { repo = "sharkdp/fd", asset = "${arch}-unknown-linux-musl.tar.gz" }
unzip_to = "${bin_dir}"
files = "*/fd"

[bat]
# Cat with syntax highlighting - https://github.com/sharkdp/bat
github = { repo = "sharkdp/bat", asset = "${arch}-unknown-linux-musl.tar.gz" }
unzip_to = "${bin_dir}"
files = "*/bat"

[fzf]
# Fuzzy finder - https://github.com/junegunn/fzf
github = { repo = "junegunn/fzf", asset = "linux_${goarch}.tar.gz" }
unzip_to = "${bin_dir}"
files = "fzf"

[zoxide]
# Smarter cd command - https://github.com/ajeetdsouza/zoxide
github = { repo = "ajeetdsouza/zoxide", asset = "${arch}-unknown-linux-musl.tar.gz" }
unzip_to = "${bin_dir}"
files = "zoxide"

[delta]
# Git diff viewer - https://github.com/dandavison/delta
# Note: gnu rather than musl, because no aarch64 musl build is published
github = { repo = "dandavison/delta", asset = "${arch}-unknown-linux-gnu.tar.gz" }
unzip_to = "${bin_dir}"
files = "*/delta"

[aws-cli]
# AWS CLI v2 - official installer
url = "https://awscli.amazonaws.com/awscli-exe-linux-${arch}.zip"
unzip_to = "./aws-cli-installer"
